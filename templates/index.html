<!DOCTYPE html>
<html>
<head>
    <title>Azure File Upload</title>
</head>
<body>
    <h2>Upload a File to Azure Blob Storage</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br><br>
        <input type="submit" value="Upload">
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</body>
</html>
